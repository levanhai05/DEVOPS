# Chạy cả FE + BE:  docker compose up --build   →  http://localhost:8080
services:
  api:
    build: ./server
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@hai.vn}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      APP_URL: ${APP_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - api-data:/data
    restart: unless-stopped

  web:
    build: .
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
