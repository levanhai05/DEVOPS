name: CI/CD - Build & Deploy hai-shop-fe

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/hai-shop-fe

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Login to Docker Hub trên server
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # Pull image mới nhất
            docker pull ${{ secrets.DOCKER_USERNAME }}/hai-shop-fe:latest

            # Dừng và xoá container cũ (nếu có)
            docker stop hai-shop-fe || true
            docker rm hai-shop-fe || true

            # Chạy container mới, map cổng 80 của nginx trong image ra cổng 8080 của server
            docker run -d \
              --name hai-shop-fe \
              --restart always \
              -p 8080:80 \
              ${{ secrets.DOCKER_USERNAME }}/hai-shop-fe:latest

            # Dọn dẹp image cũ không dùng nữa
            docker image prune -f
